name: Fast Multi-Exit Prober

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  probe:
    name: Probe & Filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Multi-Exit Probe Engine
        run: |
          chmod +x engine.js
          node engine.js
      - name: Commit & Push Distribution
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add all_exit.json all_exit.txt all_exit_base64.txt Eternity Eternity.txt dist/ summary.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Multi-Exit & Speed Probed"
            git push origin master
          fi
