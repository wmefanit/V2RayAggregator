name: Multi-Exit Prober (Cloud Million Pool)

on:
  workflow_dispatch:
    inputs:
      sources_file:
        description: '源清单 (默认 sub/all_sources.json 全量)'
        required: false
        default: 'sub/all_sources.json'
      max_candidates:
        description: '最大探测候选数 (0 = 全量无上限；非 0 视为冒烟测试，只发 smoke-test 预发布，绝不覆盖 latest)'
        required: false
        default: '0'
      enable_xray_l7:
        description: '是否启用 Xray 协议真实 L7 验活（true=开启，false=跳过，仅保留 TCP 存活）'
        required: false
        type: boolean
        default: true
      xray_l7_limit:
        description: 'Xray L7 限测数量 (0 = 全量测完；非 0 = 只测前 N 个，用于快速冒烟)'
        required: false
        default: '0'
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    name: Million Prober & Release Distribute
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Increase System File Limits
        run: |
          ulimit -n 65535 || true

      # 可选阶段工具：xrayprobe（proxy-go 编译产物的单二进制，静态链接 xray 内核，无动态库依赖）。
      # 关闭开关时不下载、不执行，总流水线保持 ~29 分钟的极速路径。
      - name: Download Xray Prober Tool (Only when enabled)
        run: |
          if [ "$ENABLE_XRAY_L7" = "1" ]; then
            curl -fsSL -o xrayprobe "https://github.com/wmefanit/V2RayAggregator/releases/download/tools/xrayprobe"
            chmod +x xrayprobe
            echo "xrayprobe ready ($(ls -lh xrayprobe | awk '{print $5}'))"
          else
            echo "ENABLE_XRAY_L7=0 -> 跳过 xrayprobe 下载"
          fi
        env:
          ENABLE_XRAY_L7: ${{ github.event.inputs.enable_xray_l7 != 'false' && '1' || '0' }}

      # 冒烟运行（max_candidates != 0）只做验证，产物写到 smoke-test 预发布 tag；
      # 正式全量运行（max_candidates == 0，含定时任务）才写 latest，防止小样本污染正式订阅。
      - name: Resolve Release Target
        id: target
        env:
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '0' }}
        run: |
          if [ "$MAX_CANDIDATES" = "0" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "mode=FULL (发布到 latest 正式订阅)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=smoke-test" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "mode=SMOKE (仅发布到 smoke-test 预发布，不动 latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Million Prober (Azure Bandwidth)
        env:
          SOURCES_FILE: ${{ github.event.inputs.sources_file || 'sub/all_sources.json' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '0' }}
          TCP_CONCURRENCY: "1200"
          L7_CONCURRENCY: "800"
          DNS_CONCURRENCY: "300"
          TCP_TIMEOUT_MS: "2000"
          L7_TIMEOUT_MS: "4000"
          CHUNK_SIZE: "20000"
          ENABLE_XRAY_L7: ${{ github.event.inputs.enable_xray_l7 != 'false' && '1' || '0' }}
          XRAY_L7_LIMIT: ${{ github.event.inputs.xray_l7_limit || '0' }}
          XRAY_L7_CONCURRENCY: "400"
          XRAY_L7_TIMEOUT: "4"
        run: |
          node probe.js "$SOURCES_FILE"

      - name: Package Country & Protocol Archives
        run: |
          if [ -d "dist/by_country" ]; then
            tar -czf dist_country.tar.gz -C dist by_country
          fi
          if [ -d "dist/by_protocol" ]; then
            tar -czf dist_protocol.tar.gz -C dist by_protocol
          fi

      - name: Publish / Overwrite GitHub Release (Zero Git Repo Bloat)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
          RUN_MODE: ${{ steps.target.outputs.mode }}
        run: |
          set -e
          NOW=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          REPO="${{ github.repository }}"
          TCP_ALIVE=$(grep -c '^[a-zA-Z0-9]' all_exit.txt 2>/dev/null || echo "0")
          L7_VERIFIED=$(grep -c '^[a-zA-Z0-9]' all_l7_verified.txt 2>/dev/null || echo "0")
          XRAY_ALIVE=$(grep -c '^[a-zA-Z0-9]' xray_alive.txt 2>/dev/null || echo "0")
          CONSERVATION=$(node -e "console.log(require('./summary.json').conservation_check||'UNKNOWN')" 2>/dev/null || echo "UNKNOWN")

          cat << EOF > release_notes.md
          ## 🚀 Million-Scale Multi-Exit Proxy Pool (Auto-Updated)

          - **Run Mode**: \`${RUN_MODE}\`
          - **Last Updated**: \`${NOW}\`
          - **Update Frequency**: Every 6 Hours (00:00, 06:00, 12:00, 18:00 UTC)
          - **Conservation Check**: \`${CONSERVATION}\`

          ### 📊 Pool Sizes (分层口径)
          - **TCP Alive Pool**: \`${TCP_ALIVE}\` 节点（TCP 握手可达，未做协议验证）
          - **L7 Verified Pool (HTTP/SOCKS)**: \`${L7_VERIFIED}\` 节点（204 协议通断已确认）
          - **Xray TCP-Alive Pool**: \`${XRAY_ALIVE}\` 节点（云端仅确认 TCP 可达，需本地 strictprobe 精验）

          ### 🔍 验证等级说明（避免口径混淆）
          - \`all_exit.txt\`：TCP 可达。**不等于可用**，仅表示端口能建立 TCP 连接。
          - \`all_l7_verified.txt\`：通过 HTTP CONNECT / SOCKS4 / SOCKS5 隧道向 cp.cloudflare.com 取得 204。**协议层可用**。
          - \`xray_alive.txt\`：VLESS/VMess/Trojan/SS 的 TCP 可达但**云端未验活**节点（供本地精验）。\n  - \`all_xray_verified.txt\`：云端 xrayprobe 真实 L7 验活通过的 Xray 节点（CONNECT 隧道 + TLS + 内容断言）。
          - \`high_speed.txt\`：多协议配额均衡精选池（HTTP/SOCKS4/SOCKS5/VLESS/VMess/Trojan/SS 按配额融合，全部经过真实 L7 验活，按实测业务延迟升序）。**注意：这是延迟排序，不是带宽测速**。
          - 本流水线**不做下载带宽测速**（百万池带宽测试流量与耗时不可控），带宽由本地按需复验。

          ### 📥 Direct Subscription & Download Links:
          - **Full TCP-Alive Pool**: [\`all_exit.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/all_exit.txt)
          - **Full Pool with Geo & Verification Meta**: [\`all_exit_meta.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/all_exit_meta.txt)
          - **L7 Verified Pool (HTTP/SOCKS)**: [\`all_l7_verified.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/all_l7_verified.txt)
          - **Xray TCP-Alive Pool**: [\`xray_alive.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/xray_alive.txt)
          - **Low-Latency Top 500 (L7 verified)**: [\`high_speed.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/high_speed.txt)
          - **Base64 Subscription**: [\`Eternity.txt\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/Eternity.txt)
          - **Summary Metrics**: [\`summary.json\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/summary.json)
          - **Country Bundles**: [\`dist_country.tar.gz\`](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/dist_country.tar.gz)
          EOF

          ASSETS="all_exit.txt all_exit_meta.txt all_exit_base64.txt \
            all_l7_verified.txt all_l7_verified_meta.json \
            xray_alive.txt xray_alive_meta.json \
            all_xray_verified.txt all_xray_verified_base64.txt all_xray_verified_b64.txt all_xray_verified_meta.json \
            all_l7_verified_base64.txt \
            high_speed.txt high_speed_base64.txt high_speed_b64.txt high_speed_meta.json \
            high_speed_socks5.txt high_speed_socks4.txt high_speed_http.txt \
            high_speed_vless.txt high_speed_vless_base64.txt high_speed_vmess.txt high_speed_vmess_base64.txt \
            high_speed_trojan.txt high_speed_trojan_base64.txt high_speed_ss.txt high_speed_ss_base64.txt \
            Eternity.txt summary.json \
            dist_country.tar.gz dist_protocol.tar.gz"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" $ASSETS --clobber
          else
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" --target master --prerelease \
                --title "Smoke Test Pool (${NOW})" --notes-file release_notes.md
            else
              gh release create "$RELEASE_TAG" --target master \
                --title "Latest Multi-Exit Proxy Pool" --notes-file release_notes.md
            fi
            gh release upload "$RELEASE_TAG" $ASSETS --clobber
          fi

          gh release edit "$RELEASE_TAG" \
            --title "$([ "$PRERELEASE" = "true" ] && echo "Smoke Test Pool" || echo "Latest Multi-Exit Proxy Pool") (${NOW})" \
            --notes-file release_notes.md

          echo "已发布到 tag=${RELEASE_TAG} (prerelease=${PRERELEASE})"
