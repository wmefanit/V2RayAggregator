name: Collect

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

permissions:
  contents: write

jobs:
  main:
    name: Collect & SpeedTest & Filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install localserver npm deps
        run: |
          cd ./utils/localserver && npm install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./utils/requirements.txt
      - name: Set Timezone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'
      - name: Install Requirements
        run: |
          pip install -r ./utils/requirements.txt

      - name: Running Collector
        run: |
          wget -O subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/download/v0.7.2/subconverter_linux64.tar.gz
          tar -zxvf subconverter.tar.gz -C ./
          chmod +x ./subconverter/subconverter && nohup ./subconverter/subconverter >./subconverter.log 2>&1 &
          node ./utils/localserver/index.js &
          sleep 2
          python ./utils/list_merge.py

      - name: Run Lite Speedtest
        run: |
          sleep 5
          # 修正测试源为本地刚刚生成的聚合文件
          wget -O lite-linux-amd64.gz https://github.com/xxf098/LiteSpeedTest/releases/download/v0.14.1/lite-linux-amd64-v0.14.1.gz
          gzip -d -f lite-linux-amd64.gz
          chmod +x ./lite-linux-amd64
          # 用本地 yaml 文件测速，不依赖上游写死的 mahdibland 远端 URL
          if [ -f "./sub/sub_merge_yaml.yml" ]; then
            sudo nohup ./lite-linux-amd64 --config ./utils/speedtest/lite_config_yaml.json --test ./sub/sub_merge_yaml.yml > speedtest.log 2>&1 &
            python ./utils/speedtest/output.py
          else
            echo "no sub_merge_yaml.yml found, skip speedtest"
          fi

      - name: Run Convertor & Formatter
        run: |
          sleep 2
          if [ ! -f "./subconverter/subconverter" ]; then
            wget -O subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/download/v0.7.2/subconverter_linux64.tar.gz
            tar -zxvf subconverter.tar.gz -C ./
            chmod +x ./subconverter/subconverter && nohup ./subconverter/subconverter >./subconverter.log 2>&1 &
          fi
          python ./utils/eternity_convert.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Aggregated & Tested"
            git push origin master
          fi
