name: Fast Multi-Exit Prober

on:
  workflow_dispatch:
    inputs:
      sources_file:
        description: '源清单文件 (sub/sample_sources.json 或 sub/all_sources.json)'
        required: false
        default: 'sub/sample_sources.json'
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    name: Probe & Distribute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Prober
        run: |
          SRC="${{ github.event.inputs.sources_file || 'sub/sample_sources.json' }}"
          echo "使用源清单: $SRC"
          node probe.js "$SRC"

      - name: Commit & Push Output
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A all_exit.json all_exit.txt all_exit_base64.txt high_speed.txt Eternity Eternity.txt dist/ summary.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Probed"
            git push origin master
          fi
