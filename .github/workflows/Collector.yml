name: Multi-Exit Prober (Cloud)

on:
  workflow_dispatch:
    inputs:
      sources_file:
        description: '源清单 (sub/sample_sources.json 或 sub/all_sources.json)'
        required: false
        default: 'sub/sample_sources.json'
      max_candidates:
        description: '最大探测候选数 (0 = 不限/全量百万)'
        required: false
        default: '10000'
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    name: Probe & Distribute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cloud Prober
        env:
          SOURCES_FILE: ${{ github.event.inputs.sources_file || 'sub/sample_sources.json' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '10000' }}
          TCP_CONCURRENCY: "500"
          DNS_CONCURRENCY: "200"
          TCP_TIMEOUT_MS: "2000"
        run: |
          node probe.js "$SOURCES_FILE"

      - name: Commit & Push Distribution
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A all_exit.json all_exit.txt all_exit_meta.txt all_exit_base64.txt high_speed.txt Eternity Eternity.txt dist/ summary.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Multi-Exit Distribution"
            git push origin master
          fi
